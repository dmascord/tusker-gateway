apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tusker-gateway-api
  namespace: hermes
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hindsight
      podSelector:
        matchLabels:
          app: hindsight
    ports:
    - port: 8642
      protocol: TCP
  podSelector:
    matchLabels:
      app: tusker-gateway
  policyTypes:
  - Ingress
