apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tusker-gateway-api
  namespace: hermes
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hindsight
      podSelector:
        matchLabels:
          app: hindsight
    # Prometheus scrapes /metrics directly on the pod IP; the credential is
    # the only thing separating an arbitrary pod in this namespace from the
    # endpoint, so the rule stays namespace-scoped.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 8642
      protocol: TCP
  podSelector:
    matchLabels:
      app: tusker-gateway
  policyTypes:
  - Ingress
