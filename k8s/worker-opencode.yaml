apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-opencode-worker
  namespace: hermes
  labels:
    app: tusker-opencode-worker
  annotations:
    tusker.net.au/commit: d3d4d6083ff3ee4862793d4c7ad5ba40495c1125
    tusker.net.au/image-tag: swarm-alpine-d3d4d6083ff3ee4862793d4c7ad5ba40495c1125
    tusker.net.au/image-digest: sha256:bef26c3e0eb85036911f18c0f6d53ce3d073fce9b7e20639c033790ce160385d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-opencode-worker
  template:
    metadata:
      labels:
        app: tusker-opencode-worker
    spec:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: tusker-opencode-worker
        image: registry.tusker.net.au:5000/tusker-gateway@sha256:bef26c3e0eb85036911f18c0f6d53ce3d073fce9b7e20639c033790ce160385d
        imagePullPolicy: Always
        command: ["tini", "--", "python", "-m", "tusker_gateway.worker"]
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-opencode-worker
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TUSKER_WORKER_MODE
          value: '1'
        - name: TUSKER_WORKER_PORT
          value: '8643'
        - name: TUSKER_OPENCODE_CLI_ENABLED
          value: 'true'
        - name: TUSKER_CLAUDE_CODE_ENABLED
          value: 'false'
        - name: TUSKER_OPENCODE_WARM_ENABLED
          value: '0'
        - name: TUSKER_OPENCODE_CLI_API_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        - name: TUSKER_LOG_LEVEL
          value: 'INFO'
        ports:
        - containerPort: 8643
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 3Gi
            ephemeral-storage: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8643
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8643
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      # CLI homes are pod-local: the live .claude.json is already outside the
      # mount, and the share only held backups/plugin caches. No NFS needed.
      - name: tusker-home
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tusker-opencode-worker
  namespace: hermes
spec:
  selector:
    app: tusker-opencode-worker
  ports:
  - name: http
    port: 8643
    targetPort: 8643
    protocol: TCP