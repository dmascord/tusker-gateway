apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-claude-worker
  namespace: hermes
  labels:
    app: tusker-claude-worker
  annotations:
    tusker.net.au/commit: 5d2e3ff88706fff95864bf171c4331a1c89769d4
    tusker.net.au/image-tag: swarm-alpine-5d2e3ff88706fff95864bf171c4331a1c89769d4
    tusker.net.au/image-digest: sha256:99a07b67b93b30a40324e7c012f45803acd28b9916c05f6bcfdb3a8305465301
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-claude-worker
  template:
    metadata:
      labels:
        app: tusker-claude-worker
    spec:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: tusker-claude-worker
        image: registry.tusker.net.au:5000/tusker-gateway@sha256:99a07b67b93b30a40324e7c012f45803acd28b9916c05f6bcfdb3a8305465301
        imagePullPolicy: Always
        command: ["tini", "--", "python", "-m", "tusker_gateway.worker"]
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-claude-worker
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TUSKER_WORKER_MODE
          value: '1'
        - name: TUSKER_WORKER_PORT
          value: '8643'
        - name: TUSKER_OPENCODE_CLI_ENABLED
          value: 'false'
        - name: TUSKER_CLAUDE_CODE_ENABLED
          value: 'true'
        - name: TUSKER_LOG_LEVEL
          value: 'INFO'
        ports:
        - containerPort: 8643
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 3Gi
            ephemeral-storage: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8643
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8643
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      # The Claude Code CLI keeps its OAuth login in
      # ~/.claude/.credentials.json. With pod-local emptyDir that file would
      # be empty on every restart, so seed it from a Secret into the same
      # writable emptyDir the CLI uses. The CLI can refresh the token in
      # place; each fresh pod re-seeds the (still-valid) refresh token.
      # Placed AFTER `containers` so pin-manifest.py rewrites the main image.
      initContainers:
      - name: seed-claude-credentials
        image: registry.tusker.net.au:5000/tusker-gateway@sha256:d7a5c0d44bbe8477e443752312f1486d0155a4ef4a48bf2b0b8bc884ed0ec731
        securityContext:
          runAsUser: 0
        command: ["sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /home/tusker/.claude
          cp /etc/claude-credentials/.credentials.json /home/tusker/.claude/.credentials.json
          chmod 600 /home/tusker/.claude/.credentials.json
          chown 65534:65534 /home/tusker/.claude/.credentials.json
        volumeMounts:
        - name: tusker-home
          mountPath: /home/tusker/.claude
        - name: claude-credentials
          mountPath: /etc/claude-credentials
          readOnly: true
      volumes:
      # CLI homes are pod-local: the live .claude.json is already outside the
      # mount, and the share only held backups/plugin caches. No NFS needed.
      - name: tusker-home
        emptyDir: {}
      - name: claude-credentials
        secret:
          secretName: claude-cli-credentials
          defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: tusker-claude-worker
  namespace: hermes
spec:
  selector:
    app: tusker-claude-worker
  ports:
  - name: http
    port: 8643
    targetPort: 8643
    protocol: TCP