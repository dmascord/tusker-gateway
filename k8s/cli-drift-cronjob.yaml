# Weekly provider-CLI version drift check.
#
# The gateway's CLI routes depend on binaries pinned in the Dockerfile;
# upstream deprecates models and ships new free ones, so a stale pin means
# a stale auto-catalog. This CronJob compares the pins against npm
# "latest" and fails the Job on drift (visible via `kubectl -n hermes get
# jobs -l app=tusker-cli-drift` and KubeJobFailed alerts). Upgrades stay
# deliberate: bump the Dockerfile ARG, mirror it in the env below, and
# deploy through k8s/deploy.sh.
#
# The cluster image ships no repo checkout, so the checker is mounted from
# this ConfigMap and the pins are duplicated in the env below.
# tests/test_cli_drift_wiring.py asserts the ConfigMap is byte-identical to
# k8s/check_cli_version_drift.py and the env pins match the Dockerfile ARGs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tusker-cli-drift-check
  namespace: hermes
  labels:
    app: tusker-cli-drift
data:
  check_cli_version_drift.py: |
    #!/usr/bin/env python3
    """Check pinned provider-CLI versions against the latest npm releases.

    The gateway's CLI routes (opencode-cli, claude-code-cli, kilo-cli) run
    binaries pinned in the Dockerfile. Upstream keeps deprecating models and
    shipping new free ones, so a stale pin means a stale model catalog:
    newer CLIs list new free models (the auto-catalog adopts them into the
    code pool automatically) and drop deprecated entries from ``opencode
    models``. Models that a newer CLI still lists but refuses to serve are
    handled at request time by the adapter's 410 retired-model mapping, so
    this check is about freshness, not correctness.

    Pinned versions come from the Dockerfile when present; the weekly k8s
    CronJob has no repo checkout and passes ``*_CLI_VERSION`` environment
    variables instead (``k8s/cli-drift-cronjob.yaml``; a regression test
    pins the manifest against the Dockerfile and this script). Exit code 1
    means at least one package drifted. Upgrades stay a deliberate,
    provenance-tracked deploy (``k8s/deploy.sh``) - this only raises the
    flag.
    """
    from __future__ import annotations

    import json
    import os
    import re
    import sys
    import urllib.request
    from pathlib import Path

    REPO_ROOT = Path(__file__).resolve().parents[1]

    # Dockerfile ARG name -> npm package.
    PACKAGES = {
        "CLAUDE_CODE_CLI_VERSION": "@anthropic-ai/claude-code",
        "OPENCODE_CLI_VERSION": "@opencode/cli",
        "KILO_CLI_VERSION": "@kilocode/cli",
    }


    def _pinned_from_dockerfile(arg: str) -> str | None:
        dockerfile = REPO_ROOT / "Dockerfile"
        if not dockerfile.exists():
            return None
        match = re.search(
            rf"^ARG {arg}=([0-9][0-9A-Za-z.+-]*)$", dockerfile.read_text(), re.MULTILINE
        )
        return match.group(1) if match else None


    def _latest_version(package: str) -> str:
        encoded = package.replace("@", "%40").replace("/", "%2f")
        url = f"https://registry.npmjs.org/{encoded}/latest"
        with urllib.request.urlopen(url, timeout=30) as response:
            return json.loads(response.read())["version"]


    def main() -> int:
        drift = 0
        print(f"{'PACKAGE':<28} {'PINNED':<12} {'LATEST':<12} STATUS")
        for arg, package in PACKAGES.items():
            pinned = os.environ.get(arg) or _pinned_from_dockerfile(arg)
            if not pinned:
                print(f"{package:<28} {'-':<12} {'-':<12} NO PIN FOUND")
                drift = 1
                continue
            try:
                latest = _latest_version(package)
            except Exception as exc:
                print(
                    f"{package:<28} {pinned:<12} {'-':<12} "
                    f"QUERY FAILED: {type(exc).__name__}"
                )
                drift = 1
                continue
            if pinned == latest:
                print(f"{package:<28} {pinned:<12} {latest:<12} up-to-date")
            else:
                print(
                    f"{package:<28} {pinned:<12} {latest:<12} "
                    "DRIFT - upgrade via Dockerfile ARG + k8s/deploy.sh"
                )
                drift = 1
        return drift


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tusker-cli-drift-check
  namespace: hermes
  labels:
    app: tusker-cli-drift
spec:
  schedule: "17 6 * * 1"  # Mondays ~06:17 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 1209600  # 14 days
      template:
        metadata:
          labels:
            app: tusker-cli-drift
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
          - name: check
            image: python:3.11-slim
            command: ["python3", "/check/check_cli_version_drift.py"]
            env:
            # Keep in sync with the Dockerfile ARGs (test_cli_drift_wiring).
            - name: CLAUDE_CODE_CLI_VERSION
              value: "2.1.301"
            - name: OPENCODE_CLI_VERSION
              value: "2.0.30"
            - name: KILO_CLI_VERSION
              value: "7.8.12"
            volumeMounts:
            - name: script
              mountPath: /check
              readOnly: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          volumes:
          - name: script
            configMap:
              name: tusker-cli-drift-check
