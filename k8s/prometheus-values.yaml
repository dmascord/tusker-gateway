# kube-prometheus-stack values for visor cluster
# Minimal install: Prometheus + Grafana only.
# Storage: Longhorn (default SC).

alertmanager:
  enabled: false

# The control-plane and kube-proxy metrics endpoints are not bound in this
# cluster. Keep their ServiceMonitors disabled so Prometheus does not report
# nine permanent connection-refused targets as outages.
kubeControllerManager:
  serviceMonitor:
    enabled: false

kubeEtcd:
  serviceMonitor:
    enabled: false

kubeProxy:
  serviceMonitor:
    enabled: false

kubeScheduler:
  serviceMonitor:
    enabled: false

# Export Kubernetes object state required by the backup and workload alerts.
# The WildDuck verification alert depends on CronJob success timestamps.
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Scrape ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

grafana:
  enabled: true
  adminPassword: "tusker-grafana"
  grafana.ini:
    server:
      protocol: http
      domain: ai.tusker.net.au
      root_url: "https://%(domain)s/grafana/"
      serve_from_sub_path: true
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
  defaultDashboardsEnabled: false
defaultRules:
  create: false
