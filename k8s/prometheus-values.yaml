# kube-prometheus-stack values for visor cluster
# Minimal install: Prometheus + Grafana only.
# Storage: Longhorn (default SC).

# Alertmanager delivers every PrometheusRule alert (k8s/prometheus-rules.yaml)
# to the operator mailbox over wildduck SMTP. Routing lives in the GLOBAL base
# config below, NOT in an AlertmanagerConfig CR: the operator injects a
# namespace="<cr-ns>" matcher into every AlertmanagerConfig route, so a single
# monitoring-scoped CR silently drops every alert whose series does not carry
# namespace="monitoring" -- including all tusker-gateway alerts (namespace=hermes)
# and all node/cluster alerts (no namespace label). The base route is not
# namespaced, so "receiver: email" catches everything.
#
# The SMTP password is mounted from the monitoring/alertmanager-smtp secret via
# alertmanagerSpec.secrets and referenced as a file; it is NEVER stored here.
# Recreate the secret out-of-band:
#   kubectl -n monitoring create secret generic alertmanager-smtp \
#     --from-literal=username=remediation --from-literal=password='<smtp password>'
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: email
      group_by: ["alertname", "namespace", "instance"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Suppress the always-on heartbeat and the info-only inhibitor probe.
        - matchers: ['alertname=~"Watchdog|InfoInhibitor"']
          receiver: "null"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: "-tusker@tusker.org"
            from: "-remediation@tusker.net.au"
            smarthost: "wildduck.tusker.net.au:587"
            auth_username: "remediation"
            auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
            require_tls: true
            send_resolved: true
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity=~"warning|info"']
        equal: ["alertname", "instance"]
      - source_matchers: ['alertname="InfoInhibitor"']
        target_matchers: ['severity="info"']
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp

# The control-plane and kube-proxy metrics endpoints are not bound in this
# cluster. Keep their ServiceMonitors disabled so Prometheus does not report
# nine permanent connection-refused targets as outages.
kubeControllerManager:
  serviceMonitor:
    enabled: false

kubeEtcd:
  serviceMonitor:
    enabled: false

kubeProxy:
  serviceMonitor:
    enabled: false

kubeScheduler:
  serviceMonitor:
    enabled: false

# Export Kubernetes object state required by the backup and workload alerts.
# The WildDuck verification alert depends on CronJob success timestamps.
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Scrape ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

grafana:
  enabled: true
  adminPassword: "tusker-grafana"
  grafana.ini:
    server:
      protocol: http
      domain: ai.tusker.net.au
      root_url: "https://%(domain)s/grafana/"
      serve_from_sub_path: true
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
  defaultDashboardsEnabled: false
defaultRules:
  create: false
