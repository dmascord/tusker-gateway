apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tusker-gateway
  namespace: hermes
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: tusker-gateway
  namespaceSelector:
    matchNames:
      - hermes
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # /metrics and /dashboard fail closed unless TUSKER_METRICS_TOKEN is
      # configured, so the scraper must present the same credential the
      # gateway reads. The token lives in its own secret rather than
      # tusker-env-vault: the operator may mount a referenced secret into
      # the Prometheus pod, which must not expose every provider key.
      authorization:
        type: Bearer
        credentials:
          name: tusker-gateway-metrics
          key: token
