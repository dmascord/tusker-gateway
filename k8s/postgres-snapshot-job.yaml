# Longhorn recurring snapshot job for the gateway's PostgreSQL PVC.
#
# Captures a snapshot every 15 minutes (96 retained = 24 hours). This is a
# volume-level point-in-time recovery option alongside the nightly logical
# backup in postgres-backup.yaml.
#
# Apply once:
#   kubectl apply -f k8s/postgres-snapshot-job.yaml
#
# Targeting: Longhorn matches a RecurringJob to volumes via groups on the
# Volume CR. `groups: [default]` is only an implicit match for volumes with
# NO recurring-job labels; this PVC is explicitly labelled for the cluster's
# weekly backup, so that job would never select it. Use a dedicated group and
# label the PVC as the label source so the setting survives volume rebuilds.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: gateway-postgres-snapshot-15m
  namespace: longhorn-system
  labels:
    app: tusker-gateway-postgres
spec:
  cron: "*/15 * * * *"
  task: snapshot
  retain: 96
  concurrency: 1
  groups:
  - gateway-postgres-snapshots
  labels:
    app: tusker-gateway-postgres
