# PrometheusRule resources for the cluster checks used by the live monitoring stack.
# Apply with kubectl in the monitoring namespace after kube-state-metrics is enabled.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-health
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: cluster-health
      rules:
        - alert: KubernetesNodeKubeletDown
          annotations:
            description: Prometheus cannot scrape the kubelet on {{ $labels.node }} for more than 10 minutes.
            summary: Kubelet is down on {{ $labels.node }}
          expr: up{job="kubelet",metrics_path="/metrics"} == 0
          for: 10m
          labels:
            severity: critical
        - alert: KubernetesNodeKubeletMissing
          annotations:
            description: Only {{ $value }} of 6 expected kubelet scrape targets are present.
            summary: Kubelet scrape target is missing
          expr: count(up{job="kubelet",metrics_path="/metrics"}) < 6
          for: 10m
          labels:
            severity: critical
        - alert: KubernetesNodeNotReady
          annotations:
            description: kube-state-metrics reports node {{ $labels.node }} as NotReady for 5 minutes.
            summary: Node {{ $labels.node }} is NotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: KubernetesPersistentVolumeAlmostFull
          annotations:
            description: Persistent volume has less than 15% free space on {{ $labels.node }}.
            summary: 'Persistent volume almost full: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}'
          expr: kubelet_volume_stats_capacity_bytes > 0 and kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 15m
          labels:
            severity: warning
        - alert: NodeExporterDown
          annotations:
            description: Host metrics from {{ $labels.instance }} are missing for 15 minutes.
            summary: node-exporter is down on {{ $labels.instance }}
          expr: up{job="node-exporter"} == 0
          for: 15m
          labels:
            severity: warning
        - alert: KubeJobFailedRecent
          annotations:
            description: The disk-health-check job failed within the last hour.
            summary: 'Disk health check failed: {{ $labels.job_name }}'
          expr: kube_job_status_failed{namespace="longhorn-system",job_name=~"disk-health-check-.*"} > 0 and (time() - kube_job_status_start_time{namespace="longhorn-system",job_name=~"disk-health-check-.*"}) < 3600
          for: 15m
          labels:
            severity: warning
        - alert: StorageMonitorCronJobStalled
          annotations:
            description: The disk-health-check CronJob has not succeeded for over 30 minutes, so USB disk and Longhorn node problems would go unnoticed.
            summary: Storage monitor has not completed successfully
          expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="disk-health-check"} > 1800
          for: 5m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wildduck-backup
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: wildduck-backup
      rules:
        - alert: WildduckBackupVerifyStalled
          annotations:
            description: The wildduck-backup-verify CronJob has not completed successfully for over 3 hours, so a broken WildDuck backup mirror would go unnoticed.
            summary: WildDuck backup verification has not passed in over 3 hours
          expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="wildduck-backup-verify"} > 10800
          for: 15m
          labels:
            severity: critical
        - alert: WildduckBackupVerifyNeverRan
          annotations:
            description: No successful run of the wildduck-backup-verify CronJob is recorded, so the WildDuck mail archive is unverified.
            summary: WildDuck backup verification has never succeeded
          expr: absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="wildduck-backup-verify"})
          for: 30m
          labels:
            severity: critical
---
# Gateway availability and memory alerts. These catch scrape outages,
# restart storms, OOM kills, and sustained memory pressure.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tusker-gateway
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: tusker-gateway
      rules:
        - alert: TuskerGatewayScrapeDown
          annotations:
            description: Prometheus cannot scrape the tusker-gateway /metrics endpoint for more than 2 minutes, so the gateway is down or unreachable.
            summary: Tusker gateway scrape target is down
          expr: up{job="tusker-gateway"} == 0
          for: 2m
          labels:
            severity: critical
        - alert: TuskerGatewayOAuthRefreshLockUnavailable
          annotations:
            description: A gateway replica fell back to a process-local OAuth refresh lock for provider {{ $labels.provider }}; cross-process refresh coordination is degraded and concurrent replicas can consume the same single-use token.
            summary: Gateway OAuth refresh lock is failing open
          expr: increase(tusker_oauth_refresh_lock_unavailable_total{job="tusker-gateway"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: TuskerGatewayRestartStorm
          annotations:
            description: The tusker-gateway pod has restarted {{ $value | humanize }} times in the last 15 minutes, indicating a crash loop (see OOMKilled alert).
            summary: Tusker gateway is crash-looping
          expr: increase(kube_pod_container_status_restarts_total{namespace="hermes",pod=~"tusker-gateway-.*",container="tusker-gateway"}[15m]) >= 2
          labels:
            severity: critical
        - alert: TuskerGatewayOOMKilled
          annotations:
            description: A tusker-gateway container was OOM-killed within the last 15 minutes (exit 137 against its memory limit).
            summary: Tusker gateway container was OOM-killed
          expr: increase(kube_pod_container_status_last_terminated_reason{namespace="hermes",pod=~"tusker-gateway-.*",container="tusker-gateway",reason="OOMKilled"}[15m]) > 0
          labels:
            severity: critical
        - alert: TuskerGatewayMemoryNearLimit
          annotations:
            description: tusker-gateway is using over 90% of its memory limit for 5 minutes; an OOM kill is imminent.
            summary: Tusker gateway is close to its memory limit
          expr: container_memory_working_set_bytes{namespace="hermes",pod=~"tusker-gateway-.*",container="tusker-gateway"} / on(namespace,pod,container) group_left kube_pod_container_resource_limits{namespace="hermes",resource="memory",container="tusker-gateway"} > 0.9
          for: 5m
          labels:
            severity: warning

        # The gateway's config store, audit chain, OAuth credentials and
        # quality data all live in this single Postgres instance. No exporter
        # is deployed, so these rules use kube-state-metrics / kubelet volume
        # metrics plus the backup CronJob's own status.
        - alert: TuskerGatewayPostgresNoReadyPod
          annotations:
            description: No tusker-gateway-postgres pod is Ready for more than 2 minutes; config reload, OAuth rotation and audit writes will fail closed.
            summary: Gateway Postgres has no ready pod
          expr: kube_pod_status_ready{namespace="hermes",pod=~"tusker-gateway-postgres-.*",condition="true"} == 0
          for: 2m
          labels:
            severity: critical
        - alert: TuskerGatewayPostgresRestartStorm
          annotations:
            description: tusker-gateway-postgres restarted at least twice in 15 minutes; check the PVC and logs before it loses the state volume.
            summary: Gateway Postgres is crash-looping
          expr: increase(kube_pod_container_status_restarts_total{namespace="hermes",pod=~"tusker-gateway-postgres-.*",container="postgres"}[15m]) >= 2
          labels:
            severity: critical
        - alert: TuskerGatewayPostgresVolumeAlmostFull
          annotations:
            description: The gateway Postgres PVC has less than 20% free; turn_captures can grow ~800 MB/day and a full volume stops every write.
            summary: Gateway Postgres volume almost full
          expr: kubelet_volume_stats_available_bytes{namespace="hermes",persistentvolumeclaim="tusker-gateway-postgres-data"} / kubelet_volume_stats_capacity_bytes{namespace="hermes",persistentvolumeclaim="tusker-gateway-postgres-data"} < 0.2
          for: 15m
          labels:
            severity: warning
        - alert: TuskerGatewayBackupStalled
          annotations:
            description: The nightly gateway Postgres dump has not succeeded in 26 hours; the state store has no current backup.
            summary: Gateway Postgres backup is stale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="hermes",cronjob="tusker-gateway-postgres-backup"} > 93600
          for: 10m
          labels:
            severity: warning
        - alert: TuskerGatewayBackupNeverRan
          annotations:
            description: No successful gateway Postgres backup has ever been recorded; check the CronJob and its PVC.
            summary: Gateway Postgres backup has never succeeded
          expr: absent(kube_cronjob_status_last_successful_time{namespace="hermes",cronjob="tusker-gateway-postgres-backup"})
          for: 30m
          labels:
            severity: critical

        - alert: PrometheusStorageAlmostFull
          annotations:
            description: Prometheus TSDB PVC has less than 15% free space; ingestion may stop before retention compaction catches up.
            summary: Prometheus storage almost full
          expr: kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus.*"} / kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus.*"} < 0.15
          for: 15m
          labels:
            severity: critical

        - alert: PrometheusIngestionStalled
          annotations:
            description: Prometheus has healthy scrape targets but appended no samples for 10 minutes; investigate TSDB/PVC pressure.
            summary: Prometheus ingestion stalled
          expr: sum(up{job=~"kubelet|kube-state-metrics|tusker-gateway"}) > 0 and increase(prometheus_tsdb_head_samples_appended_total[10m]) == 0
          for: 10m
          labels:
            severity: critical
