              name: tusker-env-vault
              key: GITHUB_COPILOT_CREDENTIALS
        - name: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
        - name: PROVIDER_OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
