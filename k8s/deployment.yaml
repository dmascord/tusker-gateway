apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-gateway
  namespace: hermes
  labels:
    app: tusker-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: maxSurge 1 + maxUnavailable 0 keeps the old pod
      # serving until the new pod is Ready. Requires shared RWX volume.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tusker-gateway
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 90
      containers:
      - name: tusker-gateway
        image: registry.tusker.net.au:5000/tusker-gateway:swarm-alpine-postgres-state-sanitize-202609071921
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-gateway
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        # Shared mutable gateway state lives in the dedicated PostgreSQL
        # service. SQLite paths remain as local/test fallbacks only.
        - name: TUSKER_STATE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-postgres-auth
              key: DATABASE_URL
        - name: TUSKER_STATE_DATABASE_POOL_MAX
          value: '12'
        # Startup and request-path state operations remain bounded during a
        # PostgreSQL restart. Advisory stores use process-local safe defaults;
        # rate limits, budgets, and idempotency fail explicitly with 503.
        - name: TUSKER_STATE_DATABASE_CONNECT_TIMEOUT
          value: '2'
        - name: TUSKER_STATE_DEGRADED_MODE
          value: advisory
        # The response cache is disposable; keep it off the shared RWX volume
        # so SQLite is no longer a multi-writer failure surface in production.
        - name: TUSKER_CACHE_ENABLED
          value: 'false'
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: API_KEYS
        - name: TUSKER_SEMANTIC_CACHE_ENABLED
          # Keep the production switch explicit. The image contains the
          # pinned model and the safety gates below are ready for a canary.
          value: 'false'
        - name: TUSKER_SEMANTIC_CACHE_THRESHOLD
          value: '0.92'
        - name: TUSKER_SEMANTIC_CACHE_TTL
          value: '300'
        - name: TUSKER_SEMANTIC_CACHE_MAX_ENTRIES
          value: '5000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_INPUT_CHARS
          value: '12000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_RESPONSE_BYTES
          value: '262144'
        - name: TUSKER_SEMANTIC_CACHE_MODEL
          value: sentence-transformers/all-MiniLM-L6-v2
        - name: TUSKER_SEMANTIC_CACHE_MODEL_REVISION
          value: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        - name: TUSKER_SEMANTIC_CACHE_DEVICE
          value: cpu
        - name: TUSKER_SEMANTIC_CACHE_LOCAL_FILES_ONLY
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_INIT_TIMEOUT_SECS
          value: '120'
        - name: TUSKER_SEMANTIC_CACHE_OPERATION_TIMEOUT_SECS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_MAX_CONCURRENT_OPERATIONS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_REQUIRE_DETERMINISTIC
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_EXCLUDED_POOLS
          value: privacy
        - name: TUSKER_SEMANTIC_CACHE_PATH
          value: /home/tusker/.hermes/semantic_cache
        - name: TUSKER_COPILOT_BUSINESS
          value: "true"
        # Local hardware routes use LAN endpoints, never pod loopback.
        - name: PROVIDER_REGISTRY_JSON
          value: '{"local-llm":{"kind":"local","base_url":"http://10.0.0.212:11434","chat_path":"/v1/chat/completions","models_path":"/api/tags","zdr_ok":true},"mlx-mac":{"kind":"local","base_url":"http://10.0.0.141:11435","chat_path":"/v1/chat/completions","models_path":"/v1/models","zdr_ok":true,"model_aliases":{"qwen3-coder-30b-a3b-instruct-4bit":"/Users/tusker/models/Qwen3-Coder-30B-A3B-Instruct-4bit"}}}'
        - name: TUSKER_AUTO_FREE_EXCLUDED_PROVIDERS
          value: nvidia
        # Do not poll provider catalogs that are intentionally unavailable or
        # currently over quota;
        # direct routes remain diagnosable and can be re-enabled by removing
        # the provider from this list after credentials/quota are repaired.
        - name: TUSKER_CATALOG_DISABLED_PROVIDERS
          value: arcee,arliai,cohere,openai,cerebras
        # These providers currently have no usable pool route. Keeping them
        # out of pool construction prevents repeated missing-key/quota noise.
        - name: TUSKER_DISABLED_PROVIDERS
          value: arcee,cohere,cerebras
        # Block explicit chat/Responses/Anthropic provider routes while the
        # upstream accounts are retired or unavailable. This fails fast with
        # provider_route_disabled instead of returning an upstream 502.
        - name: TUSKER_PASSTHROUGH_DISABLED_PROVIDERS
          value: cerebras
        # /v1/rerank is a dedicated native-provider route and is not disabled
        # by the chat-pool list above. It uses rerank_path + provider keys.
        - name: TUSKER_POOL_CODE
          value: '{"models":[{"provider":"minimax","model":"MiniMax-M3","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:vision","input_modalities":["text","image"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"groq","model":"openai/gpt-oss-120b","input_modalities":["text"]},{"provider":"groq","model":"openai/gpt-oss-20b","input_modalities":["text"]},{"provider":"groq","model":"qwen/qwen3.6-27b","input_modalities":["text","image"]},{"provider":"zai","model":"glm-4.7"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"},{"provider":"github-copilot","model":"gpt-5.6-luna"},{"provider":"github-copilot-enterprise","model":"gpt-5.6-luna"}],"auto_catalog_providers":["minimax","synthetic","zai","openai-codex","github-copilot","github-copilot-enterprise","opencode-go","ollama-cloud","groq","google"],"context_window":128000,"zdr":false,"auto_free":true,"fallback_pools":["premium","swarm"]}'
        - name: TUSKER_POOL_PRIVACY
          value: '{"models":[{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:vision","input_modalities":["text","image"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"github-copilot-enterprise","model":"gpt-5-mini"},{"provider":"github-copilot-enterprise","model":"gpt-4o-mini"},{"provider":"github-copilot-enterprise","model":"gpt-4.1","auto_discovered":true},{"provider":"github-copilot-enterprise","model":"gpt-4.1-2025-04-14","auto_discovered":true},{"provider":"github-copilot-enterprise","model":"gpt-5.4-mini","auto_discovered":true},{"provider":"github-copilot-enterprise","model":"mai-code-1-flash-picker","auto_discovered":true},{"provider":"ollama-cloud","model":"ollama/deepseek-v4-flash"},{"provider":"opencode-go","model":"minimax-m3"},{"provider":"opencode-go","model":"minimax-m2.7"},{"provider":"opencode-go","model":"qwen3.6-plus"},{"provider":"opencode-go","model":"qwen3.5-plus"},{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5-pro","input_modalities":["text"]},{"provider":"ollama-cloud","model":"glm-5.1"},{"provider":"ollama-cloud","model":"deepseek-v4-flash:preview"},{"provider":"ollama-cloud","model":"kimi-k2.6"},{"provider":"ollama-cloud","model":"gpt-oss:20b"},{"provider":"ollama-cloud","model":"minimax-m2.7"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"},{"provider":"github-copilot","model":"gpt-5.6-luna"},{"provider":"github-copilot-enterprise","model":"gpt-5.6-luna"}],"context_window":128000,"zdr":true,"auto_free":true,"auto_catalog_providers":["synthetic","github-copilot","opencode-go","ollama-cloud","xiaomi"]}'
        - name: TUSKER_POOL_PREMIUM
          value: '{"models":[{"provider":"github-copilot-enterprise","model":"claude-sonnet-4.6"},{"provider":"github-copilot-enterprise","model":"claude-opus-4.6"},{"provider":"openai-codex","model":"gpt-5.6-sol"},{"provider":"openai-codex","model":"gpt-5.6-terra"},{"provider":"openai-codex","model":"gpt-5.5"},{"provider":"openai-codex","model":"gpt-5.4"},{"provider":"github-copilot-enterprise","model":"gpt-5.5"},{"provider":"github-copilot-enterprise","model":"gpt-5.4"},{"provider":"opencode-go","model":"deepseek-v4-pro"},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:vision","input_modalities":["text","image"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"google","model":"gemini-3-pro"}],"context_window":128000}'
        - name: TUSKER_POOL_SWARM
          value: '{"models":[{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5","input_modalities":["text","image"]}],"context_window":128000}'
        - name: PROVIDER_GITHUB_COPILOT_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_GITHUB_COPILOT_ENTERPRISE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_ENTERPRISE_TOKEN
        - name: GITHUB_COPILOT_CREDENTIALS
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_CREDENTIALS
        - name: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
        - name: PROVIDER_OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENROUTER_API_KEY
        - name: PROVIDER_GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GROQ_API_KEY
        - name: PROVIDER_ARCEE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: ARCEEAI_API_KEY
        - name: PROVIDER_ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GLM_API_KEY
        - name: PROVIDER_XIAOMI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: XIAOMI_API_KEY
        - name: PROVIDER_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GEMINI_API_KEY
        - name: PROVIDER_CEREBRAS_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CEREBRAS_API_KEY
        - name: PROVIDER_COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COHERE_API_KEY
        - name: PROVIDER_VOYAGE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: VOYAGE_API_KEY
        - name: PROVIDER_JINA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: JINA_API_KEY
        - name: PROVIDER_MINIMAX_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: MINIMAX_API_KEY
        - name: PROVIDER_SYNTHETIC_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: SYNTHETIC_API_KEY
        - name: PROVIDER_OLLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OLLAMA_API_KEY
        - name: PROVIDER_NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: NVIDIA_API_KEY
        - name: PROVIDER_OPENCODE_GO_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_GO_API_KEY
        - name: PROVIDER_OPENCODE_ZEN_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: HF_TOKEN
        - name: TUSKER_RATELIMIT_ENABLED
          value: 'true'
        - name: TUSKER_RATELIMIT_DEFAULT_RATE
          value: '10'
        - name: TUSKER_RATELIMIT_DEFAULT_BURST
          value: '20'
        # Hindsight consolidation can issue several structured LLM calls at
        # once. Keep the global default conservative, but give its dedicated
        # key enough burst capacity to avoid self-inflicted 429 storms.
        - name: TUSKER_RATELIMIT_JSON
          value: '{"d8f3cf6f55568fe94621208d0570e5d7":{"rate_per_sec":20,"burst":64},"bed71eb19cd84ab9571c3837df8b2efb":{"rate_per_sec":30,"burst":64}}'
        - name: TUSKER_RTK_ENABLED
          value: 'true'
        - name: TUSKER_LOG_LEVEL
          value: 'INFO'
        - name: TUSKER_TOOL_CAPABILITY_GATE
          value: 'auto'
        - name: TUSKER_TOOL_DIAGNOSTICS
          value: 'true'
        - name: TUSKER_MODEL_CAPABILITY_DB_PATH
          # Keep a fresh evidence store after the prior RWX index corruption;
          # the old file remains untouched for offline forensic recovery.
          value: /home/tusker/.hermes/model_capability-recovered.db
        - name: TUSKER_CAPABILITY_PROBE_GENERATION
          value: 'false'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_ENABLED
          value: 'true'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INITIAL_DELAY_SECS
          value: '300'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INTERVAL_SECS
          value: '21600'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_LIMIT
          value: '12'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_MAX_AGE_SECS
          value: '86400'
        # Hindsight uses response_format=json_schema; keep at least two
        # recently verified privacy candidates available for that contract.
        - name: TUSKER_STRUCTURED_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_STRUCTURED_QUALIFICATION_POOL
          value: privacy
        - name: TUSKER_STRUCTURED_QUALIFICATION_LIMIT
          value: '4'
        - name: TUSKER_STRUCTURED_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_STRUCTURED_QUALIFICATION_MAX_AGE_SECS
          value: '21600'
        - name: TUSKER_CATALOG_STARTUP_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_UPSTREAM_SOCK_READ_SECS
          value: '90'
        - name: TUSKER_BUDGETS_ENABLED
          value: 'false'
        ports:
        - containerPort: 8642
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        startupProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        resources:
          requests:
            memory: 768Mi
            cpu: 500m
            ephemeral-storage: 1Gi
          limits:
            # The cluster admission policy expects resources.limits to exist;
            # ephemeral-storage caps stay well within the 2Gi/4Gi defaults
            # (see ValidatingAdmissionPolicy 'ephemeral-storage-limit').
            memory: 1Gi
            ephemeral-storage: 4Gi
      volumes:
      - name: tusker-home
        persistentVolumeClaim:
          claimName: tusker-home-rwx
