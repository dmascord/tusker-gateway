apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-gateway
  namespace: hermes
  labels:
    app: tusker-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tusker-gateway
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 90
      containers:
      - name: tusker-gateway
        image: registry.tusker.net.au:5000/tusker-gateway:swarm-alpine-20260825090000
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-gateway
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: API_KEYS
          value: d36fa730d29ed2e8749708ffc7ff7453d5c68a84b9b17360f15bffa9fb0a6a6d,1669ed9f11c615b5cb60fdfa60d23b4373c503de306eaa90039a20790427aef0,4f9736e8bfa246e74ffc11279cf59d2fe4b381cc70159255a9f78e26932bbb1f,e6507e72971c8e015b2958930497e3baaf75607e2dc178ae44f1db671bd49e0d
        - name: TUSKER_SEMANTIC_CACHE_ENABLED
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_THRESHOLD
          value: '0.85'
        - name: TUSKER_SEMANTIC_CACHE_TTL
          value: '3600'
        - name: TUSKER_SEMANTIC_CACHE_PATH
          value: /home/tusker/.hermes/semantic_cache
        - name: TUSKER_POOL_CODE
          value: '{"models":[{"provider":"minimax","model":"MiniMax-M3"},{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"synthetic","model":"syn:large:text"},{"provider":"xiaomi","model":"mimo-v2.5","input_modalities":["text","image"]},{"provider":"opencode-zen","model":"north-mini-code-free"},{"provider":"opencode-go","model":"qwen3.6-plus"},{"provider":"google","model":"gemini-3.1-flash-lite-preview"},{"provider":"cerebras","model":"gpt-oss-120b"},{"provider":"opencode-go","model":"deepseek-v4-pro"},{"provider":"opencode-zen","model":"big-pickle"},{"provider":"openrouter","model":"poolside/laguna-xs-2.1:free"},{"provider":"openrouter","model":"openai/gpt-oss-20b:free"},{"provider":"opencode-go","model":"minimax-m3"},{"provider":"opencode-go","model":"minimax-m2.7"},{"provider":"opencode-go","model":"qwen3.5-plus"},{"provider":"xiaomi","model":"mimo-v2.5-pro","input_modalities":["text"]},{"provider":"ollama-cloud","model":"glm-5.1"},{"provider":"ollama-cloud","model":"deepseek-v4-flash:preview"},{"provider":"ollama-cloud","model":"kimi-k2.6"},{"provider":"ollama-cloud","model":"gpt-oss:20b"},{"provider":"ollama-cloud","model":"minimax-m2.7"},{"provider":"opencode-zen","model":"deepseek-v4-flash-free"},{"provider":"opencode-zen","model":"mimo-v2.5-free"},{"provider":"opencode-zen","model":"hy3-free"},{"provider":"opencode-zen","model":"nemotron-3-ultra-free"},{"provider":"opencode-zen","model":"nemotron-3.5-lightning-free"},{"provider":"opencode-zen","model":"laguna-s-2.1-free"},{"provider":"opencode-zen","model":"gemini-3-flash"},{"provider":"opencode-zen","model":"minimax-m2.7"},{"provider":"opencode-zen","model":"minimax-m2.5-free"},{"provider":"openrouter","model":"nvidia/nemotron-3-ultra-550b-a55b:free"},{"provider":"openrouter","model":"nvidia/nemotron-3.5-lightning:free"},{"provider":"openrouter","model":"dots-studio/dots-3-note-preview:free"},{"provider":"openrouter","model":"google/gemma-4-31b-it:free"},{"provider":"openrouter","model":"google/gemma-4-26b-a4b-it:free"},{"provider":"openrouter","model":"cohere/north-mini-code:free"},{"provider":"openrouter","model":"openrouter/free"},{"provider":"minimax","model":"MiniMax-M2.7-highspeed"},{"provider":"zai","model":"glm-4.7"},{"provider":"cohere","model":"north-mini-code-1-0"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"}],"context_window":128000,"zdr":false,"auto_free":true}'
        - name: TUSKER_POOL_PRIVACY
          value: '{"models":[{"provider":"github-copilot-enterprise","model":"gpt-5-mini"},{"provider":"github-copilot-enterprise","model":"gpt-4o-mini"},{"provider":"ollama-cloud","model":"ollama/deepseek-v4-flash"},{"provider":"opencode-go","model":"minimax-m3"},{"provider":"opencode-go","model":"minimax-m2.7"},{"provider":"opencode-go","model":"qwen3.6-plus"},{"provider":"opencode-go","model":"qwen3.5-plus"},{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5-pro","input_modalities":["text"]},{"provider":"ollama-cloud","model":"glm-5.1"},{"provider":"ollama-cloud","model":"deepseek-v4-flash:preview"},{"provider":"ollama-cloud","model":"kimi-k2.6"},{"provider":"ollama-cloud","model":"gpt-oss:20b"},{"provider":"ollama-cloud","model":"minimax-m2.7"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"}],"context_window":128000,"zdr":true,"auto_free":true}'
        - name: TUSKER_POOL_PREMIUM
          value: '{"models":[{"provider":"github-copilot-enterprise","model":"claude-sonnet-4.6"},{"provider":"github-copilot-enterprise","model":"claude-opus-4.6"},{"provider":"openai-codex","model":"gpt-5.6-sol"},{"provider":"openai-codex","model":"gpt-5.6-terra"},{"provider":"openai-codex","model":"gpt-5.5"},{"provider":"openai-codex","model":"gpt-5.4"},{"provider":"github-copilot-enterprise","model":"gpt-5.5"},{"provider":"github-copilot-enterprise","model":"gpt-5.4"},{"provider":"opencode-go","model":"deepseek-v4-pro"},{"provider":"cerebras","model":"gpt-oss-120b"},{"provider":"synthetic","model":"syn:large:text"},{"provider":"minimax","model":"MiniMax-M2.7-highspeed"}],"context_window":128000}'
        - name: TUSKER_POOL_SWARM
          value: '{"models":[{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5","input_modalities":["text","image"]}],"context_window":128000}'
        - name: PROVIDER_GITHUB_COPILOT_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_GITHUB_COPILOT_ENTERPRISE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_OPENAI_CODEX_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENROUTER_API_KEY
        - name: PROVIDER_GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GROQ_API_KEY
        - name: PROVIDER_ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GLM_API_KEY
        - name: PROVIDER_XIAOMI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: XIAOMI_API_KEY
        - name: PROVIDER_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GEMINI_API_KEY
        - name: PROVIDER_CEREBRAS_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CEREBRAS_API_KEY
        - name: PROVIDER_COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COHERE_API_KEY
        - name: PROVIDER_MINIMAX_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: MINIMAX_API_KEY
        - name: PROVIDER_SYNTHETIC_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: SYNTHETIC_API_KEY
        - name: PROVIDER_OLLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OLLAMA_API_KEY
        - name: PROVIDER_OPENCODE_GO_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_GO_API_KEY
        - name: PROVIDER_OPENCODE_ZEN_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        - name: TUSKER_RATELIMIT_ENABLED
          value: 'true'
        - name: TUSKER_RATELIMIT_DEFAULT_RATE
          value: '10'
        - name: TUSKER_RATELIMIT_DEFAULT_BURST
          value: '20'
        - name: TUSKER_BUDGETS_ENABLED
          value: 'true'
        - name: TUSKER_GLOBAL_DAILY_TOKENS
          value: '250000'
        ports:
        - containerPort: 8642
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        startupProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
            ephemeral-storage: 1Gi
          limits:
            # The cluster admission policy expects resources.limits to exist;
            # ephemeral-storage caps stay well within the 2Gi/4Gi defaults
            # (see ValidatingAdmissionPolicy 'ephemeral-storage-limit').
            # Memory has no upper bound here because the semantic-cache
            # embedding model (all-MiniLM-L6-v2) blows past 512Mi during
            # init and OOMKills the container — revisit once a lighter
            # model is in use.
            ephemeral-storage: 4Gi
      volumes:
      - name: tusker-home
        persistentVolumeClaim:
          claimName: tusker-home
