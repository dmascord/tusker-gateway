        - name: PROVIDER_OPENCODE_GO_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_GO_API_KEY
        - name: PROVIDER_OPENCODE_ZEN_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        - name: PROVIDER_APIM_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: APIM_PRIMARY_API_KEY
        - name: CF_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CF_ACCOUNT_ID
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CF_API_TOKEN
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: HF_TOKEN
        - name: TUSKER_RATELIMIT_ENABLED
          value: 'true'
        - name: TUSKER_RATELIMIT_DEFAULT_RATE
          value: '10'
        - name: TUSKER_RATELIMIT_DEFAULT_BURST
          value: '20'
        # Hindsight consolidation can issue several structured LLM calls at
        # once. Keep the global default conservative, but give its dedicated
        # key enough burst capacity to avoid self-inflicted 429 storms.
        - name: TUSKER_RATELIMIT_JSON
          value: '{"d8f3cf6f55568fe94621208d0570e5d7":{"rate_per_sec":20,"burst":64},"bed71eb19cd84ab9571c3837df8b2efb":{"rate_per_sec":30,"burst":64}}'
        - name: TUSKER_RTK_ENABLED
          value: 'true'
        - name: TUSKER_LOG_LEVEL
          value: 'INFO'
        - name: TUSKER_TOOL_CAPABILITY_GATE
          value: 'auto'
        - name: TUSKER_TOOL_DIAGNOSTICS
          value: 'true'
        - name: TUSKER_MODEL_CAPABILITY_DB_PATH
          # Keep a fresh evidence store after the prior RWX index corruption;
          # the old file remains untouched for offline forensic recovery.
          value: /home/tusker/.hermes/model_capability-recovered.db
        - name: TUSKER_CAPABILITY_PROBE_GENERATION
          value: 'false'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_ENABLED
          value: 'true'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INITIAL_DELAY_SECS
          value: '300'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INTERVAL_SECS
          value: '21600'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_LIMIT
          value: '12'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_MAX_AGE_SECS
          value: '86400'
        # Hindsight uses response_format=json_schema; keep at least two
        # recently verified privacy candidates available for that contract.
        - name: TUSKER_STRUCTURED_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_STRUCTURED_QUALIFICATION_POOL
          value: privacy
        - name: TUSKER_STRUCTURED_QUALIFICATION_LIMIT
          value: '4'
        - name: TUSKER_STRUCTURED_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_STRUCTURED_QUALIFICATION_MAX_AGE_SECS
          value: '21600'
        # Input-modality probe is the missing link for vision+tool requests:
        # the pool-eligibility filter reads input_modalities from the live
        # provider catalog, but several providers (minimax, synthetic,
        # github-copilot, opencode-go) return text-only rows for models that
        # actually support images, locking them out before cooldown or
        # heavyweight checks run. A bounded image probe against the gateway
        # boundary stamps authoritative ``passed`` records into the capability
        # DB so the filter admits them again.
        #
        # Polite-provider cadence: probes are sequential
        # (``max_concurrency=1`` in modality_qualification.run_qualification)
        # with a small inter-probe delay, only ``LIMIT`` candidates per cycle,
        # quarantined routes are skipped (no probe storm during known
        # outages), and ``passed``/``unsupported`` evidence is cached for
        # ``MAX_AGE_SECS`` while transient ``unavailable`` evidence is cached
        # only for ``TRANSIENT_MAX_AGE_SECS`` so a recovered provider is
        # re-tested within hours rather than days.
        - name: TUSKER_MODALITY_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_MODALITY_QUALIFICATION_POOLS
          value: code,privacy,premium,swarm
        - name: TUSKER_MODALITY_QUALIFICATION_MODALITY
          value: image
        - name: TUSKER_MODALITY_QUALIFICATION_LIMIT
          value: '12'
        - name: TUSKER_MODALITY_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_MODALITY_QUALIFICATION_MAX_AGE_SECS
          value: '86400'
        - name: TUSKER_MODALITY_QUALIFICATION_TRANSIENT_MAX_AGE_SECS
          value: '21600'
        - name: TUSKER_MODALITY_QUALIFICATION_PER_PROBE_DELAY_SECS
          value: '2'
        - name: TUSKER_MODALITY_QUALIFICATION_INITIAL_DELAY_SECS
          value: '600'
        - name: TUSKER_MODALITY_QUALIFICATION_INTERVAL_SECS
          value: '43200'
        # Composite image-plus-tool evidence is refreshed separately from ordinary
        # tool and modality probes; routes are admitted only after both pass.
        - name: TUSKER_COMPOSITE_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_COMPOSITE_QUALIFICATION_LIMIT
          value: '8'
        - name: TUSKER_COMPOSITE_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_COMPOSITE_QUALIFICATION_MAX_AGE_SECS
          value: '86400'
        - name: TUSKER_COMPOSITE_QUALIFICATION_INTERVAL_SECS
          value: '43200'
        # Media routes are qualified out of band; no cold probe is added to requests.
        - name: TUSKER_MEDIA_QUALIFICATION_ENABLED
          value: 'true'
        # Enforce fresh explicit media qualification failures during routing.
        - name: TUSKER_MEDIA_CAPABILITY_GATE_ENABLED
          value: 'true'
        - name: TUSKER_MEDIA_QUALIFICATION_LIMIT
          value: '8'
        - name: TUSKER_MEDIA_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_MEDIA_QUALIFICATION_INITIAL_DELAY_SECS
          value: '600'
        - name: TUSKER_MEDIA_QUALIFICATION_INTERVAL_SECS
          value: '43200'
        - name: TUSKER_CATALOG_STARTUP_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_UPSTREAM_SOCK_READ_SECS
          value: '90'
        # Local Ollama/MLX Mac cold model loads need up to 240s before the
        # first byte. Kilo Auto Free runs behind a CLI worker and buffers its
        # response until the CLI exits, so it needs a longer idle window too.
        # alibaba/qwen3.8-max reasoning runs silent past the 45s default on
        # non-stream calls (no chunks to reset the idle clock until the full
        # completion is ready), so it gets a 120s window.
        # The request deadline caps every provider budget; other remote
        # candidates still return immediately and are not delayed.
        - name: TUSKER_REQUEST_TIMEOUT_MS
          value: '240000'
        - name: TUSKER_PROVIDER_ATTEMPT_TIMEOUT_OVERRIDES_JSON
          value: '{"local-llm": 240, "mlx-mac": 240, "zai": 90, "opencode-go": 90, "kilo-cli": 120, "alibaba/qwen3.8-max": 120, "ollama-cloud": 180, "synthetic": 180}'
        # Real context windows of servers whose window differs from the pool
        # default (keys: provider or provider/model; ":latest" optional).
        # Ollama ignores num_ctx on /v1, so this must track the host config:
        # MLX Mac sets OLLAMA_CONTEXT_LENGTH=262144 in
        # /Library/LaunchDaemons/dev.tusker.ollama.plist (2026-09-24). These
        # three model tags report native 262144 context; keep the gateway
        # declaration model-specific so newly catalogued models are not
        # silently assumed to support it. Jetson has only 8 GiB RAM, so do
        # not declare a blanket context override there; the coder model's
        # Modelfile explicitly sets 8192.
        - name: TUSKER_CONTEXT_WINDOW_OVERRIDES_JSON
          value: '{"mlx-mac/ornith-1.5:35b": 262144, "mlx-mac/qwen3.8-27b": 262144, "mlx-mac/shirdel-coder-9b-claude-fable-5": 262144, "local-llm/qwopus-9b-coder-mtp": 8192}'
        # Per-provider streaming per-chunk idle budget overrides (seconds).
        # xiaomi/mimo large contexts regularly exceed the default 120s wall
        # clock — extend the per-chunk budget so streaming generation completes
        # without an artificial kill mid-response.
        - name: TUSKER_PROVIDER_STREAM_TIMEOUT_OVERRIDES_JSON
          value: '{"xiaomi": 600, "ollama-cloud": 300, "synthetic": 300}'
        # Single-request worker budgets on local backends. Cold-loading a
        # 7B-class model on the Jetson or MLX Mac saturates RAM and CPU;
        # queueing concurrent requests just stalls all of them. The gateway
        # fails fast to the next pool candidate instead of holding the
        # request open while the local backend thrashes.
        - name: TUSKER_LOCAL_LLM_MAX_CONCURRENT
          value: '1'
        - name: TUSKER_MLX_MAC_MAX_CONCURRENT
          value: '1'
        # Default to Pro (3) to avoid 429 "too many concurrent requests" while
        # still allowing reasonable parallelism.
        - name: TUSKER_OLLAMA_CLOUD_MAX_CONCURRENT
          value: '3'
        # How long a locally-saturated capacity group is quarantined when
        # admission is rejected. At 2s a burst re-tested every couple of
        # seconds and repeatedly produced whole-pool "no eligible candidates"
        # failures (2026-10-27); 15s lets the in-flight requests drain and
        # pushes fallback to other providers for that window.
        - name: TUSKER_PROVIDER_CAPACITY_BUSY_COOLDOWN_SECS
          value: '15'
        # Synthetic (HF inference) has no documented concurrency limit; use a
        # conservative default to avoid hammering the upstream.
        - name: TUSKER_SYNTHETIC_MAX_CONCURRENT
          value: '4'
        # Process-backed providers (opencode-cli, claude-code-cli, and kilo-cli
        # when it is not proxied to the dedicated worker) run a CLI child
        # process inside this container for the whole request. A burst of
        # concurrent clients exhausted the 3Gi limit on 2026-10-14 and the
        # kernel OOM-killed the gateway 16 times; the shared capacity
        # controller now fails fast to another candidate. Keep this at one:
        # each CLI child can approach a GiB alongside the gateway process.
        - name: TUSKER_CLI_MAX_CONCURRENT
          value: '1'
        - name: TUSKER_BUDGETS_ENABLED
          value: 'false'
        # Rejected turns are re-dispatched before the client sees them, so the
        # provider's own bytes are the only evidence of whether the verdict was
        # right. Rows go to the shared state database (turn_captures) with a
        # 7-day TTL; privacy and unknown pools keep counters but no bytes, and
        # nothing is written for a turn that is served.
        # See docs/turn-capture-replay.md.
        - name: TUSKER_STREAM_CAPTURE
          value: '1'
        ports:
        - containerPort: 8642
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        startupProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
            ephemeral-storage: 1Gi
          limits:
            # The cluster admission policy expects resources.limits to exist;
            # ephemeral-storage caps stay well within the 2Gi/4Gi defaults
            # (see ValidatingAdmissionPolicy 'ephemeral-storage-limit').
            #
            # Memory: ~600MiB gateway RSS + warm OpenCode server ~160MiB;
            # 2Gi was OOM-killed (exit 137, 2026-10-13) during concurrent
            # 16K-token request bursts. 3Gi gives burst headroom.
            memory: 3Gi
            ephemeral-storage: 4Gi
      volumes:
      - name: tusker-home
        persistentVolumeClaim:
          claimName: tusker-home-rwx
