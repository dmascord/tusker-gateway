apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-gateway
  namespace: hermes
  labels:
    app: tusker-gateway
  annotations:
    tusker.net.au/commit: 41894948e41a4d274b8a7365f14edc8c86b22898
    tusker.net.au/image-tag: swarm-alpine-41894948e41a4d274b8a7365f14edc8c86b22898
    tusker.net.au/image-digest: sha256:1a7034321e5ab9ad1da3d77b131a59b4ed8a9b0f57efb866bdeebecbb99b9626
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: maxSurge 1 + maxUnavailable 0 keeps the old pod
      # serving until the new pod is Ready. Requires shared RWX volume.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tusker-gateway
    spec:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 90
      containers:
      - name: tusker-gateway
        image: registry.tusker.net.au:5000/tusker-gateway@sha256:1a7034321e5ab9ad1da3d77b131a59b4ed8a9b0f57efb866bdeebecbb99b9626
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-gateway
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TUSKER_CLAUDE_CODE_ENABLED
          value: 'true'
        - name: TUSKER_KILO_CLI_ENABLED
          value: 'true'
        - name: TUSKER_KILO_WORKER_URL
          value: http://tusker-kilo-worker.hermes.svc.cluster.local:8643
        - name: TUSKER_OPENCODE_CLI_ENABLED
          value: 'true'
        # Keep one OpenCode server alive so requests do not each pay a private
        # server start (~6s). The server is released after the idle window, so a
        # long window is the point: it costs ~160MiB resident while warm, and a
        # restart costs about as much as one request.
        - name: TUSKER_OPENCODE_WARM_ENABLED
          value: '1'
        - name: TUSKER_OPENCODE_WARM_IDLE_SECS
          value: '1800'
        - name: TUSKER_OPENCODE_CLI_API_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        # Shared mutable gateway state lives in the dedicated PostgreSQL
        # service. SQLite paths remain as local/test fallbacks only.
        - name: TUSKER_STATE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-postgres-auth
              key: DATABASE_URL
        - name: TUSKER_STATE_DATABASE_POOL_MAX
          value: '12'

        # DB-backed config store: enable in prod (TUSKER_CONFIG_DATABASE_ENABLED=1)
        # activates the ConfigStore. The encryption key MUST stay stable; rotating
        # it under load bricks rows already encrypted under the old key.
        - name: TUSKER_CONFIG_DATABASE_ENABLED
          value: '1'
        - name: TUSKER_KEY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-config-encryption
              key: TUSKER_KEY_ENCRYPTION_KEY
        # Startup and request-path state operations remain bounded during a
        # PostgreSQL restart. Advisory stores use process-local safe defaults;
        # rate limits, budgets, and idempotency fail explicitly with 503.
        - name: TUSKER_STATE_DATABASE_CONNECT_TIMEOUT
          value: '2'
        - name: TUSKER_STATE_DEGRADED_MODE
          value: advisory
        # The response cache is disposable; keep it off the shared RWX volume
        # so SQLite is no longer a multi-writer failure surface in production.
        - name: TUSKER_CACHE_ENABLED
          value: 'false'
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: API_KEYS
        # Authenticates Prometheus scrapes of /metrics (and /dashboard).
        # The ServiceMonitor presents this same token as a bearer credential;
        # without it both endpoints fail closed. Kept in its own secret rather
        # than tusker-env-vault so the operator can never mount the whole
        # provider-key vault into the Prometheus pod.
        - name: TUSKER_METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-metrics
              key: token
        - name: TUSKER_MEMORY_BASE_URL
          value: http://hindsight.hindsight.svc.cluster.local:8888
        - name: TUSKER_SEMANTIC_CACHE_ENABLED
          # Keep the production switch explicit. The image contains the
          # pinned model and the safety gates below are ready for a canary.
          value: 'false'
        - name: TUSKER_SEMANTIC_CACHE_THRESHOLD
          value: '0.92'
        - name: TUSKER_SEMANTIC_CACHE_TTL
          value: '300'
        - name: TUSKER_SEMANTIC_CACHE_MAX_ENTRIES
          value: '5000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_INPUT_CHARS
          value: '12000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_RESPONSE_BYTES
          value: '262144'
        # Reasoning-model max_tokens floor. Bumps client max_tokens up to
        # this value for reasoning / thinking models (Qwen3, Qwopus, o1/o3,
        # DeepSeek-R1, Claude Opus, Gemini 2.5) so the thinking budget
        # isn't fully consumed before the visible answer.
        - name: TUSKER_REASONING_MAX_TOKENS_FLOOR
          value: '2000'
        - name: TUSKER_SEMANTIC_CACHE_MODEL
          value: sentence-transformers/all-MiniLM-L6-v2
        - name: TUSKER_SEMANTIC_CACHE_MODEL_REVISION
          value: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        - name: TUSKER_SEMANTIC_CACHE_DEVICE
          value: cpu
        - name: TUSKER_SEMANTIC_CACHE_LOCAL_FILES_ONLY
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_INIT_TIMEOUT_SECS
          value: '120'
        - name: TUSKER_SEMANTIC_CACHE_OPERATION_TIMEOUT_SECS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_MAX_CONCURRENT_OPERATIONS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_REQUIRE_DETERMINISTIC
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_EXCLUDED_POOLS
          value: privacy
        - name: TUSKER_SEMANTIC_CACHE_PATH
          value: /home/tusker/.hermes/semantic_cache
        - name: TUSKER_COPILOT_BUSINESS
          value: "true"
        # Local hardware routes use LAN endpoints, never pod loopback.
        - name: PROVIDER_REGISTRY_JSON
          # Both hardware routes use Ollama's OpenAI-compatible API on the LAN.
          # Ollama itself uses Apple MLX (Metal GPU) as its inference backend,
          # so no separate mlx_lm/mlx_vlm servers are needed on the Mac.
          value: '{"local-llm":{"kind":"local","base_url":"http://10.0.0.212:11434","chat_path":"/v1/chat/completions","models_path":"/api/tags","embed_path":"/v1/embeddings","zdr_ok":true},"mlx-mac":{"kind":"local","base_url":"http://10.0.0.141:11434","chat_path":"/v1/chat/completions","models_path":"/api/tags","embed_path":"/v1/embeddings","zdr_ok":true},"groq":{"kind":"bearer","base_url":"https://api.groq.com/openai","chat_path":"/v1/chat/completions","zdr_ok":true},"workers-ai":{"kind":"bearer","base_url":"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT_ID}/ai","chat_path":"/v1/chat/completions","zdr_ok":true},"alibaba":{"kind":"bearer","base_url":"https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode","chat_path":"/v1/chat/completions","zdr_ok":false},"apim":{"kind":"api_key","base_url":"https://mcoeapim.azure-api.net/foundry/openai/v1","chat_path":"/chat/completions","auth_env":"PROVIDER_APIM_API_KEY","api_key_header":"api-key","models_path":"/models","catalog_models":["gpt-5.6-luna","gpt-6-luna"],"zdr_ok":true}}'
        - name: TUSKER_AUTO_CATALOG_EXCLUDED_PROVIDERS
          value: nvidia
        # Do not poll provider catalogs that are intentionally unavailable or
        # currently over quota;
        # direct routes remain diagnosable and can be re-enabled by removing
        # the provider from this list after credentials/quota are repaired.
        - name: TUSKER_CATALOG_DISABLED_PROVIDERS
          value: arcee,arliai,cohere,openai,cerebras
        # These providers currently have no usable pool route. Keeping them
        # out of pool construction prevents repeated missing-key/quota noise.
        - name: TUSKER_DISABLED_PROVIDERS
          value: arcee,cohere,cerebras
        # Block explicit chat/Responses/Anthropic provider routes while the
        # upstream accounts are retired or unavailable. This fails fast with
        # provider_route_disabled instead of returning an upstream 502.
        - name: TUSKER_PASSTHROUGH_DISABLED_PROVIDERS
          value: cerebras
        # Deny-list for upstream models that emit unsafe/high-impact tool
        # plans (xiaomi/mimo-v2.5 is greylisted for the tool-guard), plus
        # operator demotions for chronically slow routes. Multi-day p95s
        # repeatedly reached the 60s candidate-timeout ceiling with no
        # repeatable hour-of-day relief (2026-10-14 analysis).
        - name: TUSKER_BLACKLISTED_MODELS
          # Ollama Cloud retires these models on 2026-11-09. Keep stale DB
          # pool rows and explicit client routes from reaching the provider;
          # current catalog replacements are minimax-m3, mistral-large-4,
          # and nemotron-3-super.
          value: ollama-cloud/minimax-m2.7,ollama-cloud/mistral-large-3:675b,ollama-cloud/nemotron-3-nano:30b
        - name: TUSKER_GREYLISTED_MODELS
          value: ''
        # Comma-separated provider/model globs allowed to emit direct
        # high-impact action tools (for example place_trade).
        - name: TUSKER_TRUSTED_ACTION_MODELS
          value: ''
        - name: TUSKER_SUSPICIOUS_MODEL_THRESHOLD
          value: '3'
        # Hardening: dynamic high-impact gate (regression for goal-injection
        # via instrument tokens like NKCE / AMTD / FXMP-069 / 0364).
        # Comma-separated case-insensitive tokens that trip the gate even
        # when the tool name is innocuous. Defaults already cover the
        # canonical NKCE/AMTD/FXMP-069 set shipped in tests/fixtures/.
        - name: TUSKER_HIGH_IMPACT_INSTRUMENT_TOKENS
          value: ''
        # Comma-separated content patterns (substring/regex) that trip the
        # gate when present anywhere in the chat-completion message stream.
        # Defaults cover "place.*fx units", "buy now via", "submit.*order",
        # etc. Operators extend here for new attack phrasings.
        - name: TUSKER_HIGH_IMPACT_CONTENT_PATTERNS
          value: ''
        # When true, the high-impact gate denies unapproved calls from
        # greylisted provider/models even when the user-turn contains an
        # affirmative. Defaults to true (safe).
        - name: TUSKER_HIGH_IMPACT_GREYLIST_FORCE_DENY
          value: 'true'
        # Temporary investigation mode: record high-impact triggers and allow
        # requests without emitting an interactive OMP approval question.
        - name: TUSKER_HIGH_IMPACT_MODE
          value: audit
        - name: TUSKER_POLICY_VERSION
          value: telemetry-v1
        # LLM Stats ranking enforcement. `prefer` keeps out-of-cutoff
        # models selectable and orders them behind better-ranked ones
        # instead of dropping them from every pool (the `drop` default).
        # The rank-boost ladder then spans the full ranked range
        # (per_rank defaults to cap/199), so fall-through follows the
        # ranking. See docs/gateway-model-routing.md.
        - name: TUSKER_LLM_STATS_ENFORCEMENT
          value: prefer
        # Guardrails: enable input/output guards by default. Prompt injection
        # guard blocks "ignore previous instructions" / "you are now" / etc.;
        # harness rewriter injects an <untrusted_data> delimiter discipline
        # for callers whose identity principal matches
        # TUSKER_GUARDRAILS_HARNESS_PRINCIPALS (default "omp-harness").
        - name: TUSKER_GUARDRAILS_ENABLED
          value: 'true'
        - name: TUSKER_MAX_OUTPUT_TOKENS
          value: '16384'
        - name: TUSKER_GUARDRAILS_HARNESS_PRINCIPALS
          # The current OMP API key uses the fallback key:<fingerprint> identity.
          # Keep its principal listed until the key is assigned a named identity.
          value: omp-harness,key:bed71eb19cd8
        # Per-guard toggles: email redaction is OFF (addresses must stay
        # visible for coding workflows), credit-card redaction and the
        # prompt-injection guard stay ON.
        - name: TUSKER_GUARDRAILS_PII_EMAIL
          value: 'false'
        - name: TUSKER_GUARDRAILS_PII_CREDIT_CARD
          value: 'true'
        - name: TUSKER_GUARDRAILS_INJECTION
          value: 'true'
        # Reversible secret redaction (tusker_gateway/redaction.py): values
        # matching enabled rules are sealed into AES-SIV tokens for upstream
        # and restored for the client. TUSKER_REDACTION_KEY comes from the
        # vault; a missing/invalid key disables the guard (fail-open), so
        # redaction never destroys data it cannot restore.
        - name: TUSKER_REDACTION_ENABLED
          value: 'true'
        - name: TUSKER_REDACTION_EMAIL
          value: 'true'
        - name: TUSKER_REDACTION_CREDIT_CARD
          value: 'true'
        - name: TUSKER_REDACTION_API_KEYS
          value: 'true'
        # Preserve email/key syntax for OMP while retaining authenticated ciphertext.
        # Keep disabled unless clients require syntax-shaped redaction aliases.
        - name: TUSKER_REDACTION_FORMAT_PRESERVING
          value: 'false'
        # Entropy-gated fallback for unprefixed secrets: opt-in, because the
        # rule can false-positive on long identifiers in code.
        - name: TUSKER_REDACTION_ENTROPY_FALLBACK
          value: 'false'
        - name: TUSKER_REDACTION_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: TUSKER_REDACTION_KEY
              optional: true
        # outage blocks the request rather than silently dropping the event.
        # The log path is on the writable tusker-home RWX PVC.
        - name: TUSKER_AUDIT_LOG_PATH
          value: /home/tusker/.hermes/audit.jsonl
        - name: TUSKER_AUDIT_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: TUSKER_AUDIT_HMAC_KEY
              optional: true
        - name: TUSKER_AUDIT_FAIL_CLOSED
          value: 'true'
        - name: TUSKER_AUDIT_FSYNC
          value: 'true'
        # /v1/rerank is a dedicated native-provider route and is not disabled
        # by the chat-pool list above. It uses rerank_path + provider keys.
        # Keep embeddings on the Jetson by default (small Nomic model); use
        # configured remote providers only as ordered fallback. This is
        # separate from chat routing and does not put local-llm in a chat pool.
        - name: TUSKER_EMBED_STRATEGY
          value: priority
        - name: TUSKER_EMBED_PROVIDERS
          value: local-llm,synthetic,voyage,jina,openrouter
        - name: TUSKER_EMBED_LOCAL_LLM_MODEL
          value: nomic-embed-text
        - name: TUSKER_EMBED_LOCAL_LLM_DIMENSIONS
          value: '768'
        - name: TUSKER_POOL_CODE
          value: '{"models":[{"provider":"minimax","model":"MiniMax-M3","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"groq","model":"openai/gpt-oss-20b","input_modalities":["text"]},{"provider":"groq","model":"qwen/qwen3.6-27b","input_modalities":["text"]},{"provider":"zai","model":"glm-4.7"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"},{"provider":"github-copilot","model":"gpt-5.6-luna"},{"provider":"github-copilot-enterprise","model":"gpt-5.6-luna"},{"provider":"google","model":"gemini-3.5-flash","input_modalities":["text","image"]},{"provider":"google","model":"gemini-3.1-flash-lite","input_modalities":["text","image"]},{"provider":"google","model":"gemini-3.1-flash-lite-preview","input_modalities":["text","image"]},{"provider":"alibaba","model":"deepseek-v4-flash-0731","input_modalities":["text","image"]},{"provider":"opencode-go","model":"qwen3.6-plus"},{"provider":"zai","model":"glm-5.3-flash"},{"provider":"alibaba","model":"deepseek-v4-pro","input_modalities":["text","image"]},{"provider":"alibaba","model":"deepseek-v4.1-flash","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.6-flash","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.7-plus","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.8-flash","input_modalities":["text","image"]},{"provider":"claude-code-cli","model":"sonnet","input_modalities":["text","image"]},{"provider":"opencode-cli","model":"big-pickle","input_modalities":["text"]},{"provider":"opencode-cli","model":"cat-jam-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"longcat-2.5-preview-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"mimo-v2.6-flash-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"muse-spark-1.3-contributor-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"nemotron-3.5-lightning-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"space-bunny-free","input_modalities":["text"]},{"provider":"opencode-cli","model":"step-5-preview-free","input_modalities":["text"]},{"provider":"kilo-cli","model":"kilo/kilo-auto/free","input_modalities":["text"]}],"fallback_pools":["premium","swarm"],"auto_catalog":true,"auto_catalog_providers":["minimax","synthetic","zai","openai-codex","github-copilot","github-copilot-enterprise","alibaba","opencode-go","workers-ai","ollama-cloud","groq","google","cerebras","opencode-cli","kilo-cli"]}'
        - name: TUSKER_POOL_PRIVACY
          value: '{"models":[{"provider":"mlx-mac","model":"qwen3.8-27b","input_modalities":["text","image"]},{"provider":"apim","model":"gpt-5.6-luna","input_modalities":["text","image"]}],"context_window":128000,"zdr":true,"auto_catalog":true,"require_tool_qualification":true,"auto_catalog_providers":["mlx-mac","openai-codex","github-copilot-enterprise","ollama-cloud"]}'
        - name: TUSKER_POOL_PREMIUM
          value: '{"models":[{"provider":"github-copilot-enterprise","model":"claude-sonnet-4.6"},{"provider":"github-copilot-enterprise","model":"claude-opus-4.6"},{"provider":"openai-codex","model":"gpt-5.6-sol"},{"provider":"openai-codex","model":"gpt-5.6-terra"},{"provider":"openai-codex","model":"gpt-5.5"},{"provider":"openai-codex","model":"gpt-5.4"},{"provider":"github-copilot-enterprise","model":"gpt-5.5"},{"provider":"github-copilot-enterprise","model":"gpt-5.4"},{"provider":"opencode-go","model":"deepseek-v4-pro"},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:vision","input_modalities":["text","image"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"google","model":"gemini-3-pro"},{"provider":"alibaba","model":"glm-5.2","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.8-max","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.7-max","input_modalities":["text"]},{"provider":"alibaba","model":"glm-5.3","input_modalities":["text","image"]}],"context_window":128000,"auto_catalog":true,"auto_catalog_providers":["ollama-cloud"],"heavyweight_only":true}'
        - name: TUSKER_POOL_SWARM
          value: '{"models":[{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5","input_modalities":["text","image"]}],"context_window":128000}'
        - name: TUSKER_LOCAL_LLM_TIMEOUT_SECS
          value: '240'
        - name: PROVIDER_GITHUB_COPILOT_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_GITHUB_COPILOT_ENTERPRISE_API_KEY
          valueFrom:
