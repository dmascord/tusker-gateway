apiVersion: apps/v1
kind: Deployment
metadata:
  name: tusker-gateway
  namespace: hermes
  labels:
    app: tusker-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tusker-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: maxSurge 1 + maxUnavailable 0 keeps the old pod
      # serving until the new pod is Ready. Requires shared RWX volume.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tusker-gateway
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 90
      containers:
      - name: tusker-gateway
        image: registry.tusker.net.au:5000/tusker-gateway@sha256:0b496866464f4bc8c0a093f6f6238ef52e1a9ad35acdfb9ffff2968a8468a1bd
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: tusker-env-vault
        env:
        - name: MODEL_NAME
          value: tusker-gateway
        - name: HOME
          value: /home/tusker
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TUSKER_KILO_CLI_ENABLED
          value: 'true'
        - name: TUSKER_KILO_WORKER_URL
          value: http://tusker-kilo-worker.hermes.svc.cluster.local:8643
        # Shared mutable gateway state lives in the dedicated PostgreSQL
        # service. SQLite paths remain as local/test fallbacks only.
        - name: TUSKER_STATE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-postgres-auth
              key: DATABASE_URL
        - name: TUSKER_STATE_DATABASE_POOL_MAX
          value: '12'

        # DB-backed config store: enable in prod (TUSKER_CONFIG_DATABASE_ENABLED=1)
        # activates the ConfigStore. The encryption key MUST stay stable; rotating
        # it under load bricks rows already encrypted under the old key.
        - name: TUSKER_CONFIG_DATABASE_ENABLED
          value: '1'
        - name: TUSKER_KEY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-gateway-config-encryption
              key: TUSKER_KEY_ENCRYPTION_KEY
        # Startup and request-path state operations remain bounded during a
        # PostgreSQL restart. Advisory stores use process-local safe defaults;
        # rate limits, budgets, and idempotency fail explicitly with 503.
        - name: TUSKER_STATE_DATABASE_CONNECT_TIMEOUT
          value: '2'
        - name: TUSKER_STATE_DEGRADED_MODE
          value: advisory
        # The response cache is disposable; keep it off the shared RWX volume
        # so SQLite is no longer a multi-writer failure surface in production.
        - name: TUSKER_CACHE_ENABLED
          value: 'false'
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: API_KEYS
        - name: TUSKER_SEMANTIC_CACHE_ENABLED
          # Keep the production switch explicit. The image contains the
          # pinned model and the safety gates below are ready for a canary.
          value: 'false'
        - name: TUSKER_SEMANTIC_CACHE_THRESHOLD
          value: '0.92'
        - name: TUSKER_SEMANTIC_CACHE_TTL
          value: '300'
        - name: TUSKER_SEMANTIC_CACHE_MAX_ENTRIES
          value: '5000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_INPUT_CHARS
          value: '12000'
        - name: TUSKER_SEMANTIC_CACHE_MAX_RESPONSE_BYTES
          value: '262144'
        # Reasoning-model max_tokens floor. Bumps client max_tokens up to
        # this value for reasoning / thinking models (Qwen3, Qwopus, o1/o3,
        # DeepSeek-R1, Claude Opus, Gemini 2.5) so the thinking budget
        # isn't fully consumed before the visible answer.
        - name: TUSKER_REASONING_MAX_TOKENS_FLOOR
          value: '2000'
        - name: TUSKER_SEMANTIC_CACHE_MODEL
          value: sentence-transformers/all-MiniLM-L6-v2
        - name: TUSKER_SEMANTIC_CACHE_MODEL_REVISION
          value: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
        - name: TUSKER_SEMANTIC_CACHE_DEVICE
          value: cpu
        - name: TUSKER_SEMANTIC_CACHE_LOCAL_FILES_ONLY
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_INIT_TIMEOUT_SECS
          value: '120'
        - name: TUSKER_SEMANTIC_CACHE_OPERATION_TIMEOUT_SECS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_MAX_CONCURRENT_OPERATIONS
          value: '2'
        - name: TUSKER_SEMANTIC_CACHE_REQUIRE_DETERMINISTIC
          value: 'true'
        - name: TUSKER_SEMANTIC_CACHE_EXCLUDED_POOLS
          value: privacy
        - name: TUSKER_SEMANTIC_CACHE_PATH
          value: /home/tusker/.hermes/semantic_cache
        - name: TUSKER_COPILOT_BUSINESS
          value: "true"
        # Local hardware routes use LAN endpoints, never pod loopback.
        - name: PROVIDER_REGISTRY_JSON
          # Both hardware routes use Ollama's OpenAI-compatible API on the LAN.
          # Ollama itself uses Apple MLX (Metal GPU) as its inference backend,
          # so no separate mlx_lm/mlx_vlm servers are needed on the Mac.
          value: '{"local-llm":{"kind":"local","base_url":"http://10.0.0.212:11434","chat_path":"/v1/chat/completions","models_path":"/api/tags","embed_path":"/v1/embeddings","zdr_ok":true},"mlx-mac":{"kind":"local","base_url":"http://10.0.0.141:11434","chat_path":"/v1/chat/completions","models_path":"/api/tags","embed_path":"/v1/embeddings","zdr_ok":true},"groq":{"kind":"bearer","base_url":"https://api.groq.com/openai","chat_path":"/v1/chat/completions","zdr_ok":true},"workers-ai":{"kind":"bearer","base_url":"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT_ID}/ai","chat_path":"/v1/chat/completions","zdr_ok":true},"alibaba":{"kind":"bearer","base_url":"https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode","chat_path":"/v1/chat/completions","zdr_ok":false},"apim":{"kind":"api_key","base_url":"https://mcoeapim.azure-api.net/foundry/openai/v1","chat_path":"/chat/completions","auth_env":"PROVIDER_APIM_API_KEY","api_key_header":"api-key","models_path":"/models","zdr_ok":true}}'
        - name: TUSKER_AUTO_CATALOG_EXCLUDED_PROVIDERS
          value: nvidia
        # Do not poll provider catalogs that are intentionally unavailable or
        # currently over quota;
        # direct routes remain diagnosable and can be re-enabled by removing
        # the provider from this list after credentials/quota are repaired.
        - name: TUSKER_CATALOG_DISABLED_PROVIDERS
          value: arcee,arliai,cohere,openai,cerebras
        # These providers currently have no usable pool route. Keeping them
        # out of pool construction prevents repeated missing-key/quota noise.
        - name: TUSKER_DISABLED_PROVIDERS
          value: arcee,cohere,cerebras
        # Block explicit chat/Responses/Anthropic provider routes while the
        # upstream accounts are retired or unavailable. This fails fast with
        # provider_route_disabled instead of returning an upstream 502.
        - name: TUSKER_PASSTHROUGH_DISABLED_PROVIDERS
          value: cerebras
        # Safety deny-list for upstream models that emit unsafe/high-impact
        # tool plans. The gateway also has a built-in deny-list entry for
        # xiaomi/mimo-v2.5; this env var is for operator extensions.
        - name: TUSKER_BLACKLISTED_MODELS
          value: 'synthetic/*Kimi-K3*,*/kimi-k3*'
        - name: TUSKER_GREYLISTED_MODELS
          value: ''
        # Comma-separated provider/model globs allowed to emit direct
        # high-impact action tools (for example place_trade).
        - name: TUSKER_TRUSTED_ACTION_MODELS
          value: ''
        - name: TUSKER_SUSPICIOUS_MODEL_THRESHOLD
          value: '3'
        # Hardening: dynamic high-impact gate (regression for goal-injection
        # via instrument tokens like NKCE / AMTD / FXMP-069 / 0364).
        # Comma-separated case-insensitive tokens that trip the gate even
        # when the tool name is innocuous. Defaults already cover the
        # canonical NKCE/AMTD/FXMP-069 set shipped in tests/fixtures/.
        - name: TUSKER_HIGH_IMPACT_INSTRUMENT_TOKENS
          value: ''
        # Comma-separated content patterns (substring/regex) that trip the
        # gate when present anywhere in the chat-completion message stream.
        # Defaults cover "place.*fx units", "buy now via", "submit.*order",
        # etc. Operators extend here for new attack phrasings.
        - name: TUSKER_HIGH_IMPACT_CONTENT_PATTERNS
          value: ''
        # When true, the high-impact gate denies unapproved calls from
        # greylisted provider/models even when the user-turn contains an
        # affirmative. Defaults to true (safe).
        - name: TUSKER_HIGH_IMPACT_GREYLIST_FORCE_DENY
          value: 'true'
        # Temporary investigation mode: record high-impact triggers and allow
        # requests without emitting an interactive OMP approval question.
        - name: TUSKER_HIGH_IMPACT_MODE
          value: audit
        # Guardrails: enable input/output guards by default. Prompt injection
        # guard blocks "ignore previous instructions" / "you are now" / etc.;
        # harness rewriter injects an <untrusted_data> delimiter discipline
        # for callers whose identity principal matches
        # TUSKER_GUARDRAILS_HARNESS_PRINCIPALS (default "omp-harness").
        - name: TUSKER_GUARDRAILS_ENABLED
          value: 'true'
        - name: TUSKER_MAX_OUTPUT_TOKENS
          value: '16384'
        - name: TUSKER_GUARDRAILS_HARNESS_PRINCIPALS
          value: omp-harness
        # outage blocks the request rather than silently dropping the event.
        # The log path is on the writable tusker-home RWX PVC.
        - name: TUSKER_AUDIT_LOG_PATH
          value: /home/tusker/.hermes/audit.jsonl
        - name: TUSKER_AUDIT_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: tusker-env-vault
              key: TUSKER_AUDIT_HMAC_KEY
              optional: true
        - name: TUSKER_AUDIT_FAIL_CLOSED
          value: 'true'
        - name: TUSKER_AUDIT_FSYNC
          value: 'true'
        # /v1/rerank is a dedicated native-provider route and is not disabled
        # by the chat-pool list above. It uses rerank_path + provider keys.
        # Keep embeddings on the Jetson by default (small Nomic model); use
        # configured remote providers only as ordered fallback. This is
        # separate from chat routing and does not put local-llm in a chat pool.
        - name: TUSKER_EMBED_STRATEGY
          value: priority
        - name: TUSKER_EMBED_PROVIDERS
          value: local-llm,synthetic,voyage,jina,openrouter
        - name: TUSKER_EMBED_LOCAL_LLM_MODEL
          value: nomic-embed-text
        - name: TUSKER_EMBED_LOCAL_LLM_DIMENSIONS
          value: '768'
        - name: TUSKER_POOL_CODE
          value: '{"models":[{"provider":"minimax","model":"MiniMax-M3","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.5-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.1-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"groq","model":"openai/gpt-oss-20b","input_modalities":["text"]},{"provider":"groq","model":"qwen/qwen3.6-27b","input_modalities":["text"]},{"provider":"zai","model":"glm-4.7"},{"provider":"openai-codex","model":"gpt-5.6-luna"},{"provider":"openai-codex","model":"gpt-5.4-mini"},{"provider":"github-copilot","model":"gpt-5.6-luna"},{"provider":"github-copilot-enterprise","model":"gpt-5.6-luna"},{"provider":"google","model":"gemini-3.5-flash","input_modalities":["text","image"]},{"provider":"google","model":"gemini-3.1-flash-lite","input_modalities":["text","image"]},{"provider":"google","model":"gemini-3.1-flash-lite-preview","input_modalities":["text","image"]},{"provider":"alibaba","model":"deepseek-v4-flash-0731","input_modalities":["text","image"]},{"provider":"opencode-go","model":"qwen3.6-plus"},{"provider":"zai","model":"glm-5.3-flash"},{"provider":"alibaba","model":"deepseek-v4-pro","input_modalities":["text","image"]},{"provider":"alibaba","model":"deepseek-v4.1-flash","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.6-flash","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.7-plus","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.8-flash","input_modalities":["text","image"]}],"fallback_pools":["premium","swarm"],"auto_catalog":true,"auto_catalog_providers":["minimax","synthetic","zai","openai-codex","github-copilot","github-copilot-enterprise","alibaba","opencode-go","workers-ai","ollama-cloud","groq","google","cerebras"]}'
        - name: TUSKER_POOL_PRIVACY
          value: '{"models":[{"provider":"mlx-mac","model":"qwen3.8-27b","input_modalities":["text","image"]}],"context_window":128000,"zdr":true,"auto_catalog":true,"require_tool_qualification":true,"auto_catalog_providers":["mlx-mac","openai-codex","github-copilot-enterprise","ollama-cloud"]}'
        - name: TUSKER_POOL_PREMIUM
          value: '{"models":[{"provider":"github-copilot-enterprise","model":"claude-sonnet-4.6"},{"provider":"github-copilot-enterprise","model":"claude-opus-4.6"},{"provider":"openai-codex","model":"gpt-5.6-sol"},{"provider":"openai-codex","model":"gpt-5.6-terra"},{"provider":"openai-codex","model":"gpt-5.5"},{"provider":"openai-codex","model":"gpt-5.4"},{"provider":"github-copilot-enterprise","model":"gpt-5.5"},{"provider":"github-copilot-enterprise","model":"gpt-5.4"},{"provider":"opencode-go","model":"deepseek-v4-pro"},{"provider":"synthetic","model":"syn:large:text","input_modalities":["text"]},{"provider":"synthetic","model":"syn:large:vision","input_modalities":["text","image"]},{"provider":"synthetic","model":"syn:small:vision","input_modalities":["text","image"]},{"provider":"minimax","model":"MiniMax-M2.7-highspeed","input_modalities":["text"]},{"provider":"minimax","model":"MiniMax-M2.7","input_modalities":["text"]},{"provider":"google","model":"gemini-3-pro"},{"provider":"alibaba","model":"glm-5.2","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.8-max","input_modalities":["text","image"]},{"provider":"alibaba","model":"qwen3.7-max","input_modalities":["text"]},{"provider":"alibaba","model":"glm-5.3","input_modalities":["text","image"]}],"context_window":128000,"auto_catalog":true,"auto_catalog_providers":["ollama-cloud"],"heavyweight_only":true}'
        - name: TUSKER_POOL_SWARM
          value: '{"models":[{"provider":"opencode-go","model":"deepseek-v4-flash"},{"provider":"xiaomi","model":"mimo-v2.5","input_modalities":["text","image"]}],"context_window":128000}'
        - name: TUSKER_LOCAL_LLM_TIMEOUT_SECS
          value: '240'
        - name: PROVIDER_GITHUB_COPILOT_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COPILOT_GITHUB_TOKEN
        - name: PROVIDER_GITHUB_COPILOT_ENTERPRISE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_ENTERPRISE_TOKEN
        - name: GITHUB_COPILOT_CREDENTIALS
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_CREDENTIALS
        - name: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GITHUB_COPILOT_ENTERPRISE_CREDENTIALS
        - name: PROVIDER_OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENROUTER_API_KEY
        - name: PROVIDER_GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GROQ_API_KEY
        - name: PROVIDER_ARCEE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: ARCEEAI_API_KEY
        - name: PROVIDER_ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GLM_API_KEY
        - name: PROVIDER_XIAOMI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: XIAOMI_API_KEY
        - name: PROVIDER_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: GEMINI_API_KEY
        - name: PROVIDER_CEREBRAS_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CEREBRAS_API_KEY
        - name: PROVIDER_COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: COHERE_API_KEY
        - name: PROVIDER_VOYAGE_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: VOYAGE_API_KEY
        - name: PROVIDER_JINA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: JINA_API_KEY
        - name: PROVIDER_MINIMAX_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: MINIMAX_API_KEY
        - name: PROVIDER_SYNTHETIC_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: SYNTHETIC_API_KEY
        - name: PROVIDER_OLLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OLLAMA_API_KEY
        - name: PROVIDER_NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: NVIDIA_API_KEY
        - name: PROVIDER_OPENCODE_GO_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_GO_API_KEY
        - name: PROVIDER_OPENCODE_ZEN_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: OPENCODE_ZEN_API_KEY
        - name: PROVIDER_APIM_API_KEY
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: APIM_PRIMARY_API_KEY
        - name: CF_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CF_ACCOUNT_ID
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: CF_API_TOKEN
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              optional: true
              name: tusker-env-vault
              key: HF_TOKEN
        - name: TUSKER_RATELIMIT_ENABLED
          value: 'true'
        - name: TUSKER_RATELIMIT_DEFAULT_RATE
          value: '10'
        - name: TUSKER_RATELIMIT_DEFAULT_BURST
          value: '20'
        # Hindsight consolidation can issue several structured LLM calls at
        # once. Keep the global default conservative, but give its dedicated
        # key enough burst capacity to avoid self-inflicted 429 storms.
        - name: TUSKER_RATELIMIT_JSON
          value: '{"d8f3cf6f55568fe94621208d0570e5d7":{"rate_per_sec":20,"burst":64},"bed71eb19cd84ab9571c3837df8b2efb":{"rate_per_sec":30,"burst":64}}'
        - name: TUSKER_RTK_ENABLED
          value: 'true'
        - name: TUSKER_LOG_LEVEL
          value: 'INFO'
        - name: TUSKER_TOOL_CAPABILITY_GATE
          value: 'auto'
        - name: TUSKER_TOOL_DIAGNOSTICS
          value: 'true'
        - name: TUSKER_MODEL_CAPABILITY_DB_PATH
          # Keep a fresh evidence store after the prior RWX index corruption;
          # the old file remains untouched for offline forensic recovery.
          value: /home/tusker/.hermes/model_capability-recovered.db
        - name: TUSKER_CAPABILITY_PROBE_GENERATION
          value: 'false'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_ENABLED
          value: 'true'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INITIAL_DELAY_SECS
          value: '300'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_INTERVAL_SECS
          value: '21600'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_LIMIT
          value: '12'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_QUALIFICATION_MAINTENANCE_MAX_AGE_SECS
          value: '86400'
        # Hindsight uses response_format=json_schema; keep at least two
        # recently verified privacy candidates available for that contract.
        - name: TUSKER_STRUCTURED_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_STRUCTURED_QUALIFICATION_POOL
          value: privacy
        - name: TUSKER_STRUCTURED_QUALIFICATION_LIMIT
          value: '4'
        - name: TUSKER_STRUCTURED_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_STRUCTURED_QUALIFICATION_MAX_AGE_SECS
          value: '21600'
        # Input-modality probe is the missing link for vision+tool requests:
        # the pool-eligibility filter reads input_modalities from the live
        # provider catalog, but several providers (minimax, synthetic,
        # github-copilot, opencode-go) return text-only rows for models that
        # actually support images, locking them out before cooldown or
        # heavyweight checks run. A bounded image probe against the gateway
        # boundary stamps authoritative ``passed`` records into the capability
        # DB so the filter admits them again.
        #
        # Polite-provider cadence: probes are sequential
        # (``max_concurrency=1`` in modality_qualification.run_qualification)
        # with a small inter-probe delay, only ``LIMIT`` candidates per cycle,
        # quarantined routes are skipped (no probe storm during known
        # outages), and ``passed``/``unsupported`` evidence is cached for
        # ``MAX_AGE_SECS`` while transient ``unavailable`` evidence is cached
        # only for ``TRANSIENT_MAX_AGE_SECS`` so a recovered provider is
        # re-tested within hours rather than days.
        - name: TUSKER_MODALITY_QUALIFICATION_ENABLED
          value: 'true'
        - name: TUSKER_MODALITY_QUALIFICATION_POOLS
          value: code,privacy,premium,swarm
        - name: TUSKER_MODALITY_QUALIFICATION_MODALITY
          value: image
        - name: TUSKER_MODALITY_QUALIFICATION_LIMIT
          value: '12'
        - name: TUSKER_MODALITY_QUALIFICATION_TIMEOUT_SECS
          value: '45'
        - name: TUSKER_MODALITY_QUALIFICATION_MAX_AGE_SECS
          value: '86400'
        - name: TUSKER_MODALITY_QUALIFICATION_TRANSIENT_MAX_AGE_SECS
          value: '21600'
        - name: TUSKER_MODALITY_QUALIFICATION_PER_PROBE_DELAY_SECS
          value: '2'
        - name: TUSKER_MODALITY_QUALIFICATION_INITIAL_DELAY_SECS
          value: '600'
        - name: TUSKER_MODALITY_QUALIFICATION_INTERVAL_SECS
          value: '43200'
        - name: TUSKER_CATALOG_STARTUP_TIMEOUT_SECS
          value: '30'
        - name: TUSKER_UPSTREAM_SOCK_READ_SECS
          value: '90'
        # Local Ollama/MLX Mac cold model loads need up to 240s before the
        # first byte. The request deadline must cover the per-provider budget;
        # remote candidates still return immediately and are not delayed.
        - name: TUSKER_REQUEST_TIMEOUT_MS
          value: '240000'
        - name: TUSKER_PROVIDER_ATTEMPT_TIMEOUT_OVERRIDES_JSON
          value: '{"local-llm": 240, "mlx-mac": 240, "zai": 90, "opencode-go": 90}'
        # Real context windows of servers whose window differs from the pool
        # default (keys: provider or provider/model; ":latest" optional).
        # Ollama ignores num_ctx on /v1, so this must track the host config:
        # MLX Mac sets OLLAMA_CONTEXT_LENGTH=262144 in
        # /Library/LaunchDaemons/dev.tusker.ollama.plist (2026-09-24). These
        # three model tags report native 262144 context; keep the gateway
        # declaration model-specific so newly catalogued models are not
        # silently assumed to support it. Jetson has only 8 GiB RAM, so do
        # not declare a blanket context override there; the coder model's
        # Modelfile explicitly sets 8192.
        - name: TUSKER_CONTEXT_WINDOW_OVERRIDES_JSON
          value: '{"mlx-mac/ornith-1.5:35b": 262144, "mlx-mac/qwen3.8-27b": 262144, "mlx-mac/shirdel-coder-9b-claude-fable-5": 262144, "local-llm/qwopus-9b-coder-mtp": 8192}'
        # Per-provider streaming per-chunk idle budget overrides (seconds).
        # xiaomi/mimo large contexts regularly exceed the default 120s wall
        # clock — extend the per-chunk budget so streaming generation completes
        # without an artificial kill mid-response.
        - name: TUSKER_PROVIDER_STREAM_TIMEOUT_OVERRIDES_JSON
          value: '{"xiaomi": 600}'
        # Single-request worker budgets on local backends. Cold-loading a
        # 7B-class model on the Jetson or MLX Mac saturates RAM and CPU;
        # queueing concurrent requests just stalls all of them. The gateway
        # fails fast to the next pool candidate instead of holding the
        # request open while the local backend thrashes.
        - name: TUSKER_LOCAL_LLM_MAX_CONCURRENT
          value: '1'
        - name: TUSKER_MLX_MAC_MAX_CONCURRENT
          value: '1'
        - name: TUSKER_BUDGETS_ENABLED
          value: 'false'
        ports:
        - containerPort: 8642
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /home/tusker/.hermes
          name: tusker-home
        - mountPath: /home/tusker/.claude
          name: tusker-home
        startupProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 8642
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8642
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        resources:
          requests:
            memory: 768Mi
            cpu: 500m
            ephemeral-storage: 1Gi
          limits:
            # The cluster admission policy expects resources.limits to exist;
            # ephemeral-storage caps stay well within the 2Gi/4Gi defaults
            # (see ValidatingAdmissionPolicy 'ephemeral-storage-limit').
            memory: 1Gi
            ephemeral-storage: 4Gi
      volumes:
      - name: tusker-home
        persistentVolumeClaim:
          claimName: tusker-home-rwx
