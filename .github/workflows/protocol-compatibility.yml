name: Protocol compatibility checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check tusker_gateway/protocol_*.py
      - run: python -m pytest -q tests/test_protocol_*.py tests/test_omp_reasoning_contract.py
